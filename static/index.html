<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#152029" />
<title>Digest</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --paper: #F5F6F3;
    --paper-dim: #EBECE8;
    --card: #FFFFFF;
    --ink: #14171A;
    --ink-soft: #33383D;
    --ink-muted: #6B7278;
    --rule: #DEE1DC;
    --good: #20805D;
    --bad: #A03737;
    --forYou: #14171A;
    --sriLanka: #0E6E5F;
    --mannar: #2E7D32;
    --world: #3C4CA0;
    --technology: #1D5FA8;
    --business: #7A5B12;
    --sports: #B0501E;
    --science: #6A3E9E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171A;
      --paper-dim: #1D2226;
      --card: #181C1F;
      --ink: #F2F1EC;
      --ink-soft: #C7CBCE;
      --ink-muted: #8A9096;
      --rule: #2A2F33;
      --forYou: #F2F1EC;
      --sriLanka: #3FB8A2;
      --mannar: #6CC070;
      --world: #8D9BF0;
      --technology: #6AA8EE;
      --business: #D3AA4B;
      --sports: #F08A55;
      --science: #B993EA;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--rule);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  .topbar h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .updated { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .updated.offline { color: var(--bad); }
  .top-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    border: none;
    background: transparent;
    padding: 10px;
    cursor: pointer;
    border-radius: 999px;
    display: flex;
  }
  .icon-btn:active { background: var(--paper-dim); }
  .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 16px 10px;
    scrollbar-width: none;
    max-width: 720px;
    margin: 0 auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { color: var(--paper); background: var(--accent, var(--ink)); border-color: transparent; }

  .sortbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 16px 2px;
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
  .segmented button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink-muted);
  }
  .segmented button.active { background: var(--ink); color: var(--paper); }

  main { max-width: 720px; margin: 0 auto; padding: 6px 12px calc(40px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent, var(--rule));
    border-radius: 12px;
    padding: 14px 16px 12px;
    margin: 10px 0;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .meta .source { color: var(--accent, var(--ink-muted)); font-weight: 600; }
  .topic-chip { font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
  .badge {
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .card h2 {
    margin: 0 0 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    line-height: 1.3;
    font-weight: 600;
  }
  .card h2 a { color: inherit; text-decoration: none; }
  .card p.description { margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: var(--ink-soft); }

  .details { margin-top: 4px; font-size: 15px; line-height: 1.55; }
  .details h3 {
    margin: 10px 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .details p { margin: 0 0 10px; color: var(--ink-soft); }
  .read-full {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0 6px;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--accent, var(--ink));
    color: var(--paper);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .link-list { display: flex; flex-direction: column; gap: 6px; margin: 0 0 6px; padding: 0; list-style: none; }
  .link-list a { color: var(--accent, var(--ink)); text-decoration: none; font-size: 14px; }
  .link-list .platform { color: var(--ink-muted); font-size: 12px; margin-right: 6px; text-transform: capitalize; }
  .ai-note { font-size: 11.5px; color: var(--ink-muted); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .feedback { display: flex; gap: 6px; }
  a.more-btn { text-decoration: none; display: inline-block; }
  .more-btn {
    border: 1px solid var(--accent, var(--rule));
    border-radius: 999px;
    background: transparent;
    color: var(--accent, var(--ink));
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
  }
  .fb-btn {
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    font-size: 12px;
    padding: 6px 9px;
    cursor: pointer;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .fb-btn.selected.interested { border-color: var(--good); color: var(--good); }
  .fb-btn.selected.moderate { border-color: var(--ink-muted); color: var(--ink); }

  .state { padding: 60px 24px; text-align: center; color: var(--ink-muted); font-size: 15px; line-height: 1.5; }
  .state button, .settings button.secondary {
    margin-top: 14px;
    border: 1px solid var(--rule);
    background: var(--card);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
  }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 20; }
  .settings {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 21;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    max-width: 720px;
    margin: 0 auto;
  }
  .settings h2 { margin: 0 0 4px; font-size: 18px; }
  .settings h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); }
  .settings p { margin: 0 0 8px; font-size: 14px; line-height: 1.45; color: var(--ink-soft); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 15px; }
  .source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; }
  .source-grid label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .settings .close { float: right; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 30;
    display: flex;
    gap: 12px;
    align-items: center;
    max-width: calc(100% - 32px);
  }
  .toast button { border: none; background: transparent; color: var(--paper); font-weight: 700; cursor: pointer; padding: 0; }
</style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Digest</h1>
        <div class="updated" id="updated">Loading…</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--paper)"/><circle cx="15" cy="12" r="2" fill="var(--paper)"/><circle cx="7" cy="18" r="2" fill="var(--paper)"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <div class="sortbar">
    <span id="sortHint">Most relevant to you first</span>
    <div class="segmented" role="group" aria-label="Sort">
      <button type="button" data-sort="relevant" class="active">For you</button>
      <button type="button" data-sort="latest">Latest</button>
    </div>
  </div>

  <main id="main"><div class="state">Loading today's news…</div></main>

  <script src="config.js"></script>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
